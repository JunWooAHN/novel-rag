[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-tune"
version = "0.1.0"
description = "Portable, snapshot-based webnovel fine-tuning experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4,<5"]

[project.scripts]
toy-tune = "toy_tune.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
